apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: workspaces.forge.amahdha.com
spec:
  group: forge.amahdha.com
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workspace is the Schema for the workspaces API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec defines the desired state of Workspace
            properties:
              compoRef:
                description: CompoRef references a forge-cu composition repository.
                properties:
                  provider:
                    description: Provider is the git provider (generic, github, gitlab,
                      azure).
                    type: string
                  ref:
                    description: Ref specifies which revision to check out.
                    properties:
                      branch:
                        type: string
                      commit:
                        type: string
                      tag:
                        type: string
                    type: object
                  secretRef:
                    description: SecretRef references credentials for the composition
                      repository.
                    properties:
                      name:
                        type: string
