                    - name
                    type: object
                  url:
                    description: URL of the composition repository.
                    type: string
                required:
                - url
                type: object
              image:
                description: Image is the container image for the workspace pod.
                type: string
              initScript:
                description: InitScript is a post-start script executed in the workspace.
                type: string
              repos:
                description: Repos is a list of git repositories to clone into the
                  workspace.
                items:
                  description: RepoRef specifies a git repository to clone into the
                    workspace.
                  properties:
                    path:
                      description: Path is the mount path inside /workspace.
                      type: string
                    provider:
                      description: Provider is the git provider (generic, github,
                        gitlab, azure).
                      type: string
                    ref:
                      description: Ref specifies which revision to check out.
                      properties:
                        branch:
                          type: string
                        commit:
                          type: string
                        tag:
                          type: string
