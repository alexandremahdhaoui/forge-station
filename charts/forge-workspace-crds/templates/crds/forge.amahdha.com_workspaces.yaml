                    type: string
                  storageClassName:
                    description: StorageClassName is the storage class to use.
                    type: string
                required:
                - size
                - storageClassName
                type: object
              suspend:
                description: 'Suspend pauses reconciliation. Existing resources stay.
                  Default: false.'
                type: boolean
