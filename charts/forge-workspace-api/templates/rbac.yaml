{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "forge-workspace-api.fullname" . }}
  labels:
    {{- include "forge-workspace-api.labels" . | nindent 4 }}
rules:
# Workspace CRD permissions
- apiGroups: ["forge.amahdha.com"]
  resources: ["workspaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["forge.amahdha.com"]
  resources: ["workspaces/status"]
  verbs: ["get"]
# Portfolio CRD permissions
- apiGroups: ["forge.amahdha.com"]
  resources: ["portfolios"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["forge.amahdha.com"]
  resources: ["portfolios/status"]
  verbs: ["get"]
# Secret permissions (create credentials, read for validation)
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "forge-workspace-api.fullname" . }}
  labels:
    {{- include "forge-workspace-api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "forge-workspace-api.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "forge-workspace-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
