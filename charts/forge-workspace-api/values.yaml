# Default values for forge-workspace-api.

image:
  repository: forge-ws-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: forge-ws-api

rbac:
  create: true

replicas: 1

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
