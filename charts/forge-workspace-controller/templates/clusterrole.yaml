{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "forge-workspace-controller.fullname" . }}
  labels:
    {{- include "forge-workspace-controller.labels" . | nindent 4 }}
rules:
# Workspace CRD permissions
- apiGroups: ["forge.amahdha.com"]
  resources: ["workspaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["forge.amahdha.com"]
  resources: ["workspaces/status"]
  verbs: ["get", "update", "patch"]
# Portfolio CRD permissions
- apiGroups: ["forge.amahdha.com"]
  resources: ["portfolios"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["forge.amahdha.com"]
  resources: ["portfolios/status"]
  verbs: ["get", "update", "patch"]
# Core resource permissions for workspace lifecycle
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Leader election permissions
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Events permission for recording events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- end }}
